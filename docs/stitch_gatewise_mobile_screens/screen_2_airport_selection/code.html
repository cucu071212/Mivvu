<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GateWise — Choose Your Airport</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #202124;
    }
    .concept-label {
      padding: 16px 0 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #94a3b8;
    }
    .mobile-artboard {
      width: 390px;
      min-height: 844px;
      position: relative;
      background-color: #FAFAF7;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
  </style>
</head>
<body class="py-8 px-4">
<!-- Label ONLY outside the screen at the top -->
<div class="concept-label">MIVVU DESIGN CONCEPT · SCREEN 2</div>
<!-- Mobile 390px Canvas -->
<div class="mobile-artboard rounded-2xl overflow-hidden p-6">
<!-- Top & Main Content -->
<div class="flex flex-col">
<!-- Header Bar: Clean GateWise Mark (No 'X' close button) -->
<div class="flex items-center pt-2 mb-8">
<div class="flex items-center"><span class="text-2xl font-extrabold tracking-tight text-[#2457FF]">Mivvu</span></div>
</div>
<!-- Confident, Generous Heading Section -->
<div class="mb-6">
<h1 class="text-[32px] font-extrabold text-[#202124] tracking-tight leading-tight mb-2">
          Choose your airport
        </h1>
<p class="text-sm font-normal text-slate-500">
          Discover lounges, quiet zones, and dining at your terminal.
        </p>
</div>
<!-- Restrained Search Input -->
<div class="mb-6">
<div class="w-full bg-white rounded-xl border border-slate-200/80 px-4 py-3.5 flex items-center gap-3 shadow-[0_1px_3px_rgba(0,0,0,0.02)] focus-within:border-[#2457FF] transition"><svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg><input class="w-full bg-transparent text-sm font-medium text-[#202124] placeholder-slate-400 focus:outline-none border-0 p-0 m-0 shadow-none ring-0 focus:ring-0" placeholder="Airport, city, or code" readonly="" type="text"></div>
</div>
<!-- Airport Selection Cards List -->
<div class="flex flex-col gap-3.5"><div class="rounded-xl p-5 border-2 border-[#2457FF] bg-[#F0F4FF] flex items-center justify-between cursor-pointer transition"><div class="flex items-start gap-4"><span class="w-14 flex-shrink-0 text-2xl font-extrabold tracking-tight text-[#202124]">ICN</span><div class="flex flex-col"><span class="text-base font-bold text-[#202124] leading-snug">Incheon International<br>Airport</span><span class="text-xs font-medium text-slate-500 mt-1">Incheon, South Korea</span></div></div><div class="flex-shrink-0 ml-3"><svg class="w-5 h-5 text-[#2457FF]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div></div><div class="rounded-xl p-5 border border-[#E5E7EB] bg-white flex items-center justify-between cursor-pointer hover:border-slate-300 transition"><div class="flex items-start gap-4"><span class="w-14 flex-shrink-0 text-2xl font-extrabold tracking-tight text-[#202124]">SFO</span><div class="flex flex-col"><span class="text-base font-bold text-[#202124] leading-snug">San Francisco International<br>Airport</span><span class="text-xs font-medium text-slate-500 mt-1">San Francisco, United States</span></div></div></div></div>
</div>
<!-- Bottom Action Area -->
<div class="pt-6 pb-2">
<button class="w-full bg-[#2457FF] hover:bg-[#1b47df] active:scale-[0.99] text-white py-4 rounded-xl font-bold text-base tracking-wide flex items-center justify-center transition shadow-sm">
        Explore ICN
      </button>
</div>
</div>


</body></html>
